#################################
# GrandBIRDLizard's Picom config
# Stable low-latency xrender/glx
#################################

backend = "glx";
vsync = false;
use-damage = true;

# Help xrender/glx behave sanely on  modern X11 stacks
xrender-sync-fence = true;
glx-use-stencil = true; #TESTING


#################################
# Focus / fullscreen handling
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Critical: bypass compositor for fullscreen windows/games
unredir-if-possible = true;
unredir-if-possible-exclude = [
  "class_g = 'i3-frame'"
];

#################################
# Light visuals (safe)
#################################


fading = true;
fade-in-step = 2.0;
fade-out-step = 0.5;
fade-delta = 650;
inactive-dim = 0.25;

#################################
# Detection
#################################

detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

#################################
# Logging
#################################

log-level = "warn";

#################################
# Borders
corner-radius=14 
#window-shader-fg = ~/.config/picom/shaders/rounded-borders.glsl
