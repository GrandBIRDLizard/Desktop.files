#################################
# GrandBIRDLizard's Picom config
# Stable low-latency xrender/glx
#################################

backend = "xrender";
vsync = false;
use-damage = true;

# Helps xrender behave more sanely on modern X11 stacks
xrender-sync-fence = true;


#################################
# Focus / fullscreen handling
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Critical: bypass compositor for fullscreen windows/games
unredir-if-possible = true;
unredir-if-possible-exclude = [
  "class_g = 'i3-frame'"
];


#################################
# Light visuals (safe)
#################################

fading = true;
fade-in-step = 1.0;
fade-out-step = 0.75;
fade-delta = 750;
inactive-dim = 0.25;


#################################
# Detection
#################################

detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;


#################################
# Logging
#################################

log-level = "warn";


